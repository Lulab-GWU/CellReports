[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellreports-anxiety-ensembles"
version = "0.9.0"
description = "Reproducible analysis of context-dependent prefrontal ensemble recruitment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Xiaoqian Sun"},
  {name = "Hui Lu"},
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "pyarrow>=14,<20",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
  "seaborn>=0.12,<1",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
imaging = [
  "oasis-deconv>=0.2,<1",
  "opencv-python-headless>=4.8,<5",
  "tifffile>=2023.4",
]
notebooks = [
  "ipykernel>=6.25,<7",
  "jupyterlab>=4,<5",
  "nbconvert>=7,<8",
  "nbformat>=5.9,<6",
]
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utilities"]
